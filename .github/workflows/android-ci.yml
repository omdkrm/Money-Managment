name: Android CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'release/**'

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACKAGE_NAME: ir.modiriatsarmaye.app
  JAVA_VERSION: '21'

jobs:
  validate-and-build:
    name: Validate, Test & Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Validate Package Configuration
      # ============================================================
      - name: Validate Package Configuration
        id: package_validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Package validation"
          echo "Target: ${PACKAGE_NAME}"
          echo "=============================================="

          if [[ ! -f app/build.gradle.kts ]]; then
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          fi

          # namespace
          if ! grep -Eq \
            "namespace[[:space:]]*=[[:space:]]*\"${PACKAGE_NAME}\"" \
            app/build.gradle.kts; then

            echo "::error::namespace must be ${PACKAGE_NAME}"
            exit 1
          fi

          # applicationId
          if ! grep -Eq \
            "applicationId[[:space:]]*=[[:space:]]*\"${PACKAGE_NAME}\"" \
            app/build.gradle.kts; then

            echo "::error::applicationId must be ${PACKAGE_NAME}"
            exit 1
          fi

          # Validate Kotlin/Java package declarations.
          while IFS= read -r file; do
            package_line="$(grep -m1 '^package ' "$file" || true)"

            if [[ -n "$package_line" ]] && \
               ! grep -Eq \
               "^package[[:space:]]+${PACKAGE_NAME}([.]|$)" \
               <<< "$package_line"; then

              echo "::error::Invalid package declaration in $file"
              echo "Found: $package_line"
              exit 1
            fi
          done < <(
            find app/src/main \
              -type f \
              \( -name '*.kt' -o -name '*.java' \) \
              -print
          )

          # Reject common placeholder packages.
          forbidden_patterns=(
            "com.example"
            "com.sample"
            "com.yourapp"
            "ir.sample"
          )

          for pattern in "${forbidden_patterns[@]}"; do
            if grep -RInF \
              --exclude-dir=.git \
              --exclude-dir=build \
              --exclude='*.md' \
              --exclude='*.txt' \
              "$pattern" \
              app/src/main \
              app/build.gradle.kts \
              2>/dev/null; then

              echo "::error::Forbidden placeholder package detected: $pattern"
              exit 1
            fi
          done

          echo "Package validation: SUCCESS"
          echo "Verified package: ${PACKAGE_NAME}"

      # ============================================================
      # 3. Java
      # ============================================================
      - name: Setup Java ${{ env.JAVA_VERSION }}
        id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java
        run: |
          java -version

      # ============================================================
      # 4. Gradle
      # ============================================================
      - name: Setup Gradle
        id: gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      # ============================================================
      # 5. Unit & Regression Tests
      # ============================================================
      - name: Run Unit & Regression Tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Running unit and regression tests"
          echo "=============================================="

          ./gradlew testDebugUnitTest --stacktrace

      # ============================================================
      # 6. Android Lint
      # ============================================================
      - name: Run Android Lint
        id: lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew lintDebug --stacktrace

      # ============================================================
      # 7. Debug Build - CI TEST ONLY
      # ============================================================
      - name: Build Debug APK
        id: debug_build
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Debug APK for CI verification only."
          echo "This APK is NOT a store release."

          ./gradlew assembleDebug --stacktrace

      # ============================================================
      # 8. Upload Test Reports
      # ============================================================
      - name: Upload Unit Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Lint Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      # ============================================================
      # 9. Upload Debug APK
      # ============================================================
      - name: Upload CI Debug APK
        if: ${{ steps.debug_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: CI-TEST-BUILD-NOT-FOR-STORE-RELEASE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 10. Final Summary
      # ============================================================
      - name: Generate CI Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Android CI Summary"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Checkout | ${{ steps.checkout.outcome }} |"
            echo "| Package Validation | ${{ steps.package_validation.outcome }} |"
            echo "| Java 21 | ${{ steps.java.outcome }} |"
            echo "| Gradle Setup | ${{ steps.gradle.outcome }} |"
            echo "| Unit & Regression Tests | ${{ steps.tests.outcome }} |"
            echo "| Android Lint | ${{ steps.lint.outcome }} |"
            echo "| Debug CI Build | ${{ steps.debug_build.outcome }} |"
            echo ""
            echo "> **Important:** The Debug APK is CI/test-only."
            echo "> It must NOT be used for store publication."
            echo ""
            echo "### Package"
            echo "\`${PACKAGE_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
