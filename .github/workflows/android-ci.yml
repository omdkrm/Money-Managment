```yaml
name: Android CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Build & Validate Android App
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout Repository
        id: step_checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log Checkout Status
        if: ${{ always() }}
        run: |
          if [ "${{ steps.step_checkout.outcome }}" = "success" ]; then
            echo "Checkout: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository checked out successfully."
          else
            echo "Checkout: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi


      # ==================================================
      # 2. Package Name Validation
      # ==================================================

      - name: Validate Package Name & Reject Placeholders
        id: step_pkg_validation
        shell: bash
        run: |
          set -euo pipefail

          TARGET_PACKAGE="ir.modiriatsarmaye.app"

          echo "=================================================="
          echo "Package validation"
          echo "Target package: ${TARGET_PACKAGE}"
          echo "=================================================="

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts not found."
            exit 1
          fi

          # namespace
          if ! grep -Fq 'namespace = "ir.modiriatsarmaye.app"' app/build.gradle.kts; then
            echo "::error::namespace must be exactly ${TARGET_PACKAGE}"
            exit 1
          fi

          # applicationId
          if ! grep -Fq 'applicationId = "ir.modiriatsarmaye.app"' app/build.gradle.kts; then
            echo "::error::applicationId must be exactly ${TARGET_PACKAGE}"
            exit 1
          fi

          # Kotlin source package declarations
          if [ -d "app/src/main/java" ]; then
            KOTLIN_WRONG_PKGS="$(
              grep -RInE '^package[[:space:]]+' \
                app/src/main/java \
                --include='*.kt' \
                --include='*.kts' \
                | grep -vE "^.*:package[[:space:]]+ir\.modiriatsarmaye\.app([.].*)?$" \
                || true
            )"

            if [ -n "$KOTLIN_WRONG_PKGS" ]; then
              echo "::error::Invalid Kotlin package declarations found:"
              echo "$KOTLIN_WRONG_PKGS"
              exit 1
            fi
          fi

          # Forbidden placeholder package names
          FORBIDDEN_PATTERNS=(
            "com.example"
            "com.sample"
            "com.yourapp"
            "ir.sample"
          )

          FOUND_FORBIDDEN=0

          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            MATCHES="$(
              grep -RInF \
                --exclude-dir=".git" \
                --exclude-dir="build" \
                --exclude="*.md" \
                --exclude="*.txt" \
                "$pattern" \
                app/src/main \
                app/build.gradle.kts \
                2>/dev/null \
                || true
            )"

            if [ -n "$MATCHES" ]; then
              echo "::error::Forbidden placeholder package detected: ${pattern}"
              echo "$MATCHES"
              FOUND_FORBIDDEN=1
            fi
          done

          if [ "$FOUND_FORBIDDEN" -ne 0 ]; then
            echo "Package validation: FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Package validation: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified package: ${TARGET_PACKAGE}"


      # ==================================================
      # 3. Gradle Wrapper Validation
      # ==================================================

      - name: Validate Gradle Wrapper Integrity
        id: step_wrapper_validation
        uses: gradle/actions/wrapper-validation@v6


      # ==================================================
      # 4. Java 21
      # ==================================================

      - name: Setup Java JDK 21
        id: step_java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Log Java Status
        if: ${{ always() }}
        run: |
          java -version 2>&1

          if [ "${{ steps.step_java.outcome }}" = "success" ]; then
            echo "Java setup: SUCCESS (Temurin JDK 21)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Java setup: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi


      # ==================================================
      # 5. Gradle Setup + Cache
      # ==================================================

      - name: Setup Gradle
        id: step_gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Log Gradle Setup Status
        if: ${{ always() }}
        run: |
          if [ "${{ steps.step_gradle.outcome }}" = "success" ]; then
            echo "Gradle setup: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Gradle setup: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi


      # ==================================================
      # 6. Unit + Regression Tests
      # ==================================================

      - name: Run Unit & Regression Tests
        id: step_unit_tests
        shell: bash
        run: |
          set -o pipefail

          echo "=================================================="
          echo "Running Android unit and regression tests"
          echo "=================================================="

          ./gradlew testDebugUnitTest --stacktrace

      - name: Log Tests Status
        if: ${{ always() }}
        run: |
          if [ "${{ steps.step_unit_tests.outcome }}" = "success" ]; then
            echo "Unit & Regression Tests: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unit & Regression Tests: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi


      # ==================================================
      # 7. Android Lint
      # ==================================================

      - name: Run Android Lint
        id: step_lint
        run: ./gradlew lintDebug --stacktrace

      - name: Log Lint Status
        if: ${{ always() }}
        run: |
          if [ "${{ steps.step_lint.outcome }}" = "success" ]; then
            echo "Android Lint: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Android Lint: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi


      # ==================================================
      # 8. Debug APK
      # ==================================================

      - name: Build Debug APK for CI Verification
        id: step_build_debug
        run: |
          echo "Building Debug APK for CI verification only."
          echo "This artifact is NOT for store release."

          ./gradlew assembleDebug --stacktrace

      - name: Log Debug Build Status
        if: ${{ always() }}
        run: |
          if [ "${{ steps.step_build_debug.outcome }}" = "success" ]; then
            echo "Debug Build: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
            echo "CI TEST BUILD — NOT FOR STORE RELEASE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Debug Build: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi


      # ==================================================
      # 9. Upload Unit Test Reports
      # ==================================================

      - name: Upload Unit Test Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14


      # ==================================================
      # 10. Upload Lint Reports
      # ==================================================

      - name: Upload Lint Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14


      # ==================================================
      # 11. Upload Debug APK
      # ==================================================

      - name: Upload CI Test Debug APK
        if: ${{ steps.step_build_debug.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: CI-TEST-BUILD-NOT-FOR-STORE-RELEASE-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7


      # ==================================================
      # 12. Final CI Summary
      # ==================================================

      - name: Report Final CI Summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "### Android CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Stage | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.step_checkout.outcome }}" = "success" ]; then
            echo "| Checkout | SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Checkout | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.step_pkg_validation.outcome }}" = "success" ]; then
            echo "| Package Validation | SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Package Validation | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.step_wrapper_validation.outcome }}" = "success" ]; then
            echo "| Gradle Wrapper Validation | SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Gradle Wrapper Validation | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.step_java.outcome }}" = "success" ]; then
            echo "| Java 21 | SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Java 21 | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.step_gradle.outcome }}" = "success" ]; then
            echo "| Gradle Setup | SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Gradle Setup | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.step_unit_tests.outcome }}" = "success" ]; then
            echo "| Unit & Regression Tests | SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Unit & Regression Tests | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.step_lint.outcome }}" = "success" ]; then
            echo "| Android Lint | SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Android Lint | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.step_build_debug.outcome }}" = "success" ]; then
            echo "| Debug CI Build | SUCCESS |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Debug CI Build | FAILED |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Debug APK is CI/test-only and must NOT be used for store release.**" >> "$GITHUB_STEP_SUMMARY"
```
